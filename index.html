<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="Cedid'in yeni web sitesi çok yakında yayında.">
  <title>Cedid — Çok Yakında</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0c10; --fg:#f4f1e9; --muted:#aaa9a4; --accent:#d3ad68; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:32px; overflow:hidden; color:var(--fg); background:radial-gradient(ellipse at 50% 42%,#242019 0%,var(--bg) 62%); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    body::before { content:""; position:fixed; inset:18px; border:1px solid #ffffff12; pointer-events:none; }
    main { width:min(760px,100%); text-align:center; position:relative; }
    .mark { width:64px; height:64px; margin:0 auto 34px; display:grid; place-items:center; border:1px solid #d3ad6870; border-radius:50%; color:var(--accent); font-family:Georgia,serif; font-size:28px; }
    .eyebrow { margin:0 0 22px; color:var(--accent); font-size:12px; letter-spacing:.28em; text-transform:uppercase; }
    h1 { margin:0; font-family:Georgia,"Times New Roman",serif; font-size:clamp(48px,10vw,96px); font-weight:400; letter-spacing:-.045em; line-height:.98; }
    h1 span { display:block; color:var(--accent); font-style:italic; }
    .rule { width:48px; height:1px; margin:30px auto 24px; background:var(--accent); }
    .message { max-width:440px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.8; }
    footer { position:fixed; bottom:30px; left:0; width:100%; text-align:center; color:#77766f; font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
    @media (max-width:480px) { body { padding:24px; } body::before { inset:10px; } .message { font-size:15px; } }
    @media (prefers-reduced-motion:no-preference) { main { animation:rise .9s ease-out both; } @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">C</div>
    <p class="eyebrow">Cedid · Yeni bir başlangıç</p>
    <h1>Çok <span>yakında.</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="message">Yeni web sitemizi özenle hazırlıyoruz. Çok yakında yeniden buradayız.</p>
  </main>
  <footer>© <span id="year">2026</span> Cedid</footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
